packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 10 reads build-script approval from the workspace manifest.
# These packages legitimately need install-time compilation or engine download.
onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@prisma/client'
  - '@prisma/engines'
  - argon2
  - esbuild
  - prisma
  - unrs-resolver
